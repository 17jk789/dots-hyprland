# Don't print a new line at the start of the prompt
add_newline = false

# ============================================================
# CATPPUCCIN MOCHA
# ============================================================
#
# Base     #1e1e2e
# Mantle   #181825
# Crust    #11111b
# Surface0 #313244
# Surface1 #45475a
# Surface2 #585b70
# Overlay0 #6c7086
# Subtext0 #a6adc8
# Text     #cdd6f4
#
# Red      #f38ba8
# Peach    #fab387
# Yellow   #f9e2af
# Green    #a6e3a1
# Teal     #94e2d5
# Sky      #89dceb
# Sapphire #74c7ec
# Blue     #89b4fa
# Lavender #b4befe
# Mauve    #cba6f7
#

# Pipes ╰─ ╭─
# Powerline symbols                                     
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗
# Cool stuff 󰜥   

# format = """
# $directory $fill $git_branch $cmd_duration
#  $character"""

format = """
$os$username$hostname${env_var.SHELL_NAME}$directory${env_var.MY_IP}${env_var.PUB_IP}$git_branch$git_status$python$rust$golang$nodejs$java$c$lua$fill$cmd_duration$jobs$battery$time
$character"""

# ============================================================
# OS
# ============================================================

[os]
disabled = false
style = "bg:#313244 fg:#cdd6f4"
format = " [](bold fg:#313244)[  ]($style)"
# format = " [](bold fg:#313244)[   ]($style)"

# ============================================================
# USERNAME
# ============================================================

[username]
disabled = false
show_always = true
style_user = "bg:#313244 fg:#cdd6f4"
style_root = "bg:#313244 fg:#f38ba8"
format = "[$user]($style)"

# ============================================================
# HOSTNAME
# ============================================================

[hostname]
disabled = false
ssh_only = false
style = "bg:#313244 fg:#cdd6f4"
format = "[@$hostname]($style)[](bold fg:#313244)"
trim_at = "."

# ============================================================
# SHELL
# ============================================================

[env_var.SHELL_NAME]
variable = "SHELL_NAME"
default = "unknown"
style = "bg:#313244 fg:#cdd6f4"
# format = " [](bold fg:#313244)[ $env_value]($style)[](bold fg:#313244)"
format = "[─](bold fg:#585b70)[](bold fg:#313244)[$env_value]($style)[](bold fg:#313244)"

# ============================================================
# FILL
# ============================================================

[fill]
symbol = " ─"
style = "fg:#585b70"

# ============================================================
# CHARACTER
# ============================================================

# Replace the "❯" symbol in the prompt with "➜"
[character]                            # The name of the module we are configuring is "character"
success_symbol = "  [ ](bold #a6e3a1)"
error_symbol = "  [ ](bold #f38ba8)"

# Disable the package module, hiding it from the prompt completely

# ============================================================
# PACKAGE
# ============================================================

[package]
disabled = true

# ============================================================
# GIT BRANCH
# ============================================================

[git_branch]
# style = "bg: #45475a"
style = "bg:#cba6f7 fg:#1e1e2e"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
# format = " 󰜥 [](bold fg:#45475a)[$symbol $branch(:$remote_branch)]($style)[ ](bold fg:#45475a)"
format = "[─](bold fg:#585b70)[](bold fg:#cba6f7)[$symbol $branch(:$remote_branch)]($style)[](bold fg:#cba6f7)"

# ============================================================
# GIT COMMIT
# ============================================================

[git_commit]
commit_hash_length = 4
tag_symbol = " "

# ============================================================
# GIT STATE
# ============================================================

[git_state]
style = "bg:#b4befe fg:#1e1e2e"
format = '[─](bold fg:#585b70)[\($state( $progress_current of $progress_total)\)]($style)'
cherry_pick = "[🍒 PICKING](bold #f38ba8)"

# ============================================================
# GIT STATUS
# ============================================================

[git_status]
style = "bg:#f9e2af fg:#1e1e2e"

format = "[─](bold fg:#585b70)[](bold fg:#f9e2af)[ $all_status]($style)[](bold fg:#f9e2af)"

# conflicted = " 🏳 "
# ahead = " 🏎💨 "
# behind = " 😰 "
# diverged = " 😵 "
# untracked = " 🤷 ‍"
# stashed = " 📦 "
# modified = " 📝 "
# staged = '[++\($count\)](green)'
# renamed = " ✍️ "
# deleted = " 🗑 "

conflicted = "conflicted"
untracked = "untracked"
modified = "modified"
deleted = "deleted"
renamed = "renamed"
stashed = "stashed"
staged = " ++($count)"
ahead = "ahead"
behind = "behind"
diverged = "diverged"

# ============================================================
# HOSTNAME
# ============================================================

# [hostname]
# ssh_only = true
# style = "bg:252 fg:235"
# format =  " [](bold fg:252)[•$hostname]($style)[](bold fg:252)"
# trim_at = ".companyname.com"
# disabled = false

# ============================================================
# LINE BREAK
# ============================================================

[line_break]
disabled = false

# ============================================================
# MEMORY
# ============================================================

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed #a6e3a1"

# ============================================================
# TIME
# ============================================================

[time]
disabled = false
style = "bg:#313244 fg:#cdd6f4"
format = "[─](bold fg:#585b70)[](bold fg:#313244)[󰥔 $time]($style)[](bold fg:#313244) "
time_format = "%T"

# ============================================================
# USERNAME
# ============================================================

# [username]
# style_user = "bold bg:252 fg:235"
# style_root = "red bold"
# format = " [](bold fg:252)[$user]($style)[](bold fg:252)"
# disabled = false
# show_always = false

# ============================================================
# JOBS
# ============================================================

[jobs]
symbol = "󰒋"
style = "bg:#45475a fg:#cdd6f4"
format = "[─](bold fg:#585b70)[](bold fg:#45475a)[$symbol $number]($style)[](bold fg:#45475a)"
number_threshold = 1

# ============================================================
# BATTERY
# ============================================================

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
empty_symbol = "󰂎 "
unknown_symbol = "󰂑 "
format = "[─](bold fg:#585b70)[](bold fg:#a6e3a1)[$symbol$percentage](bg:#a6e3a1 fg:#1e1e2e)[](bold fg:#a6e3a1)"

# ============================================================
# DIRECTORY
# ============================================================
# Location → Teal
# ============================================================

# [directory]
# home_symbol = " "
# read_only = "  "
# style = "bg:255 fg:240"
# truncation_length = 5
# # truncation_symbol = ".../"
# format = " [](bold fg:255)[󰉋 → $path]($style)[](bold fg:255)"
#
# [directory.substitutions]
# "Desktop" = "  "
# "Documents" = "  "
# "Downloads" = "  "
# "Music" = " 󰎈 "
# "Pictures" = "  "
# "Videos" = "  "
# "GitHub" = " 󰊤 "

[directory]
style = "bg:#94e2d5 fg:#1e1e2e"
read_only = "  "
truncation_length = 0
fish_style_pwd_dir_length = 3
format = "[─](bold fg:#585b70)[](bold fg:#94e2d5)[󰉋 → $path]($style)[](bold fg:#94e2d5)"

# ============================================================
# COMMAND DURATION
# ============================================================
# Performance → Peach
# ============================================================

[cmd_duration]
min_time = 0
show_milliseconds = true
style = "bold bg:#fab387 fg:#1e1e2e"
format = "[](bold fg:#fab387)[󰪢 $duration]($style)[](bold fg:#fab387)"

# ============================================================
# PROGRAMMING LANGUAGES
# ============================================================
# All languages → Green
# ============================================================

# ============================================================
# PYTHON
# ============================================================

[python]
symbol = ""
style = "bg:#a6e3a1 fg:#1e1e2e"
format = "[─](bold fg:#585b70)[](bold fg:#a6e3a1)[$symbol $virtualenv]($style)[](bold fg:#a6e3a1)"
detect_extensions = [
    "py"
]
detect_files = [
    "requirements.txt",
    "pyproject.toml",
    ".python-version"
]
detect_folders = [
    ".venv",
    "venv",
    "env",
    ".env"
]

# ============================================================
# RUST
# ============================================================

[rust]
symbol = ""
style = "bg:#a6e3a1 fg:#1e1e2e"
